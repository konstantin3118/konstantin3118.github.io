<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оптовые поставки металлопроката по России и СНГ</title>
    <meta name="description" content="Оптовые поставки металлопроката от производителя. Низкие цены для оптовиков. Быстрая отгрузка партий любого объема. Работаем с металлобазами, заводами и трейдерами.">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <div class="header__up">
            <div class="container d-flex justify-content-between py-2">
                <button type="button" class="header__btn-city btn btn-link d-flex align-items-center p-0 gap-1"
                data-bs-toggle="modal"
                data-bs-target="#cityModal">
                    <i class="bi bi-geo-alt"></i>
                    <span class="js-city-name"></span>
                    <i class="bi bi-chevron-down"></i>
                </button>
                <div class="header__contacts d-flex align-items-center gap-3">
                  <div class="header__phone-email d-flex align-items-end gap-3"> 
                      <a class="header__phone js-city-phone d-flex align-items-center gap-1" href="#">
                      </a>
                      <a class="header__email js-city-email d-flex align-items-center gap-1" href="#">
                      </a>
                  </div>
                    <div class="header__social d-flex align-items-center gap-2">
                      <a class="header__telegram js-city-telegram" href="#">
                        <img class="header__telegram-icon img-icon" src="/img/icon/telegram.svg" alt="Telegram">
                      </a>
                      <a class="header__whatsapp js-city-whatsapp" href="#">
                        <img class="header__whatsapp-icon img-icon" src="/img/icon/whatsapp.svg" alt="WhatsApp">
                      </a>
                    </div>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#callbackModal">
                      Обратный звонок
                    </button>
                </div>
                
            </div>
        </div>
    </header>

    
    



<!-- Модальное окно выбора города-->
<div class="modal fade" id="cityModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Выберите город:</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body overflow-auto" style="max-height: 70vh">
            <div class="city-list">
              <!-- Сюда JS будет добавлять города -->
            </div>
        </div>
      </div>
    </div>
  </div>
  <!-------------------------------------------------------------------->

  <!-- Модальное окно обратного звонка-->
  <div class="modal fade" id="callbackModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Обратный звонок</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="callbackForm">
          <div class="modal-body">
            <label for="callbackPhone" class="form-label">Ваш телефон</label>
            <input type="tel" class="form-control" id="callbackPhone" name="phone" required placeholder="+7 (___) ___-__-__">
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary">Отправить</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <!-------------------------------------------------------------------->


    <script src="js/main.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
